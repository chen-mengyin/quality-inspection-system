    function setSyncStatus(text,type){var root=byId('syncStatus'),label=byId('syncStatusText');if(!root||!label){return;}root.className='sync-status '+(type||'');label.textContent=text;}
    function applyCloudSnapshot(snapshot){if(snapshot.lines){save(KEYS.lines,snapshot.lines);}if(snapshot.production){save(KEYS.production,snapshot.production);}if(snapshot.feedbacks){save(KEYS.feedbacks,snapshot.feedbacks);}if(snapshot.accounts){save(KEYS.accounts,snapshot.accounts);}if(snapshot.hasOwnProperty('original')){save(KEYS.original,snapshot.original||[]);}if(snapshot.summary){state.dashboardSummary=clone(snapshot.summary);}}

    function mergeCloudTasks(rows){var current=load(KEYS.production,[]),map={},result=[],i;for(i=0;i<current.length;i++){map[current[i].id]=current[i];}for(i=0;i<(rows||[]).length;i++){map[rows[i].id]=rows[i];}for(i in map){if(map.hasOwnProperty(i)){result.push(map[i]);}}save(KEYS.production,result);}

    function handleInput(event){var id=event.target.id;if(id==='scheduleSearch'||id==='scheduleInspector'){if(id==='scheduleSearch'){state.scheduleSearch=event.target.value;}else{state.scheduleInspector=event.target.value;}if(scheduleSearchTimer){clearTimeout(scheduleSearchTimer);}scheduleSearchTimer=setTimeout(function(){state.schedulePage=1;if(cloudMode){loadSchedulePage(1,true).catch(function(error){cloudFailure(error,'排产搜索失败');});}else{renderSchedule();}},300);}else if(id==='exceptionSearch'||id==='exceptionInspector'||id==='reportSearch'||id==='reportInspector'){if(id==='exceptionSearch'){state.exceptionSearch=event.target.value;}else if(id==='exceptionInspector'){state.exceptionInspector=event.target.value;}else if(id==='reportSearch'){state.reportSearch=event.target.value;}else{state.reportInspector=event.target.value;}if(viewFilterTimer){clearTimeout(viewFilterTimer);}viewFilterTimer=setTimeout(function(){if(state.tab==='exceptions'){renderExceptions();}else if(state.tab==='report'){renderReportOptimized();}},250);}}
    function bind(){byId('loginForm').addEventListener('submit',function(event){event.preventDefault();var user=byId('loginUsername').value,password=byId('loginPassword').value,button=event.target.querySelector('.login-btn');byId('loginError').textContent='';if(cloudMode){button.disabled=true;button.textContent='正在登录…';localStorage.setItem('qc_cloud_username',user);window.QCCloud.login(user,password).then(function(account){localStorage.removeItem(KEYS.savedLogin);return enterCloudApp(account);}).catch(function(error){byId('loginError').textContent=error.message||'登录失败，请重试';}).finally(function(){button.disabled=false;button.textContent='登录系统';});return;}if(login(user,password,false)){if(byId('rememberLogin').checked){save(KEYS.savedLogin,{username:user,password:password});}else{localStorage.removeItem(KEYS.savedLogin);}}});byId('logoutButton').addEventListener('click',logout);byId('alertBanner').addEventListener('click',function(){if(state.user.role==='admin'||state.user.role==='manager'||state.user.role==='planner'){activateTab('exceptions');}else{state.taskFilter='exception';activateTab('tasks');}});document.addEventListener('click',handleClick);document.addEventListener('change',handleChange);document.addEventListener('input',handleInput);document.addEventListener('visibilitychange',function(){if(!document.hidden&&cloudPendingChanges.length){var changes=cloudPendingChanges.slice();cloudPendingChanges=[];handleCloudChanges(changes);}});document.addEventListener('focusin',function(event){if(event.target.tagName==='INPUT'||event.target.tagName==='TEXTAREA'||event.target.tagName==='SELECT'){setTimeout(function(){if(event.target.scrollIntoView){event.target.scrollIntoView({block:'center'});}},250);}});window.addEventListener('online',function(){if(cloudMode&&state.user){refreshCloudData(false);}});window.addEventListener('offline',function(){setSyncStatus('网络已断开','offline');});bindPullRefresh();bindNativeApp();}
    function bindPullRefresh(){var startY=0,distance=0,pulling=false,hint=byId('pullHint');document.addEventListener('touchstart',function(event){if(window.pageYOffset===0&&!byId('modalRoot').firstChild){startY=event.touches[0].clientY;distance=0;pulling=true;}},{passive:true});document.addEventListener('touchmove',function(event){if(!pulling){return;}distance=event.touches[0].clientY-startY;if(distance>24){hint.className='pull-hint visible';hint.textContent=distance>72?'松开刷新':'下拉刷新';}},{passive:true});document.addEventListener('touchend',function(){if(!pulling){return;}hint.className='pull-hint';if(distance>72&&state.user){hint.textContent='正在刷新…';if(cloudMode){refreshCloudData(false);}else{renderApp();toast('数据已刷新','success');}}else{hint.textContent='下拉刷新';}pulling=false;distance=0;},{passive:true});}
    function bindNativeApp(){var plugins=window.Capacitor&&window.Capacitor.Plugins;if(!window.Capacitor||!window.Capacitor.isNativePlatform||!window.Capacitor.isNativePlatform()){return;}document.body.className+=' native-app';if(plugins&&plugins.StatusBar){plugins.StatusBar.setOverlaysWebView({overlay:false});plugins.StatusBar.setBackgroundColor({color:'#1859c9'});}if(plugins&&plugins.App){plugins.App.addListener('backButton',function(){if(byId('modalRoot').firstChild){closeModal();return;}if(state.user){var home=state.user.role==='qc'?'tasks':'dashboard';if(state.tab!==home){state.tab=home;renderApp();return;}}plugins.App.exitApp();});}}
    function repairCachedCloudAssets(){var key='qc_cache_repair_v8';if(sessionStorage.getItem(key)){byId('loginError').textContent='应用版本更新未完成，请彻底关闭后重新打开';return;}sessionStorage.setItem(key,'1');var reload=function(){var url=new URL(location.href);url.searchParams.set('app-version','8');location.replace(url.toString());};if(window.caches&&window.caches.keys){window.caches.keys().then(function(keys){return Promise.all(keys.filter(function(name){return name.indexOf('qc-collaboration-shell-')===0;}).map(function(name){return window.caches.delete(name);}));}).then(reload).catch(reload);}else{reload();}}
    function start(){if(cloudMode&&(!window.QCCloud||window.QCCloud.apiVersion!==8)&&/^https?:$/.test(location.protocol)){repairCachedCloudAssets();return;}sessionStorage.removeItem('qc_cache_repair_v8');initializeData();bind();if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('service-worker.js?v=8').catch(function(){});}if(cloudMode){byId('loginUsername').value=localStorage.getItem('qc_cloud_username')||'';setSyncStatus(navigator.onLine?'正在连接云端':'网络已断开',navigator.onLine?'syncing':'offline');window.QCCloud.restoreUser().then(function(user){if(user){return enterCloudApp(user);}}).catch(function(error){byId('loginError').textContent=error.message||'云端连接失败';});return;}setSyncStatus('离线（本地已保存）','offline');var saved=load(KEYS.savedLogin,null);if(saved){byId('loginUsername').value=saved.username||'';byId('loginPassword').value=saved.password||'';byId('rememberLogin').checked=true;login(saved.username,saved.password,true);}}
    start();
